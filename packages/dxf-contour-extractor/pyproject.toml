[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dxf-contour-extractor"
version = "0.2.0-alpha"
description = "Deterministic 2D DXF polyline loop reconstruction, vertex snapping, and laser/CNC cutting metrics extractor."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Bhuvan A B", email = "bhuvanab.cs24@bmsce.ac.in" },
]
keywords = [
    "cad",
    "dxf",
    "manufacturing",
    "cnc",
    "laser-cutting",
    "computational-geometry",
    "ezdxf",
    "contour-extraction"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ezdxf>=1.1.0",
    "networkx>=3.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/bhuvanabcs24-maker/Forge-IQ"
Repository = "https://github.com/bhuvanabcs24-maker/Forge-IQ/tree/main/backend/services"
Documentation = "https://bhuvanab.dev/opensource"
Issues = "https://github.com/bhuvanabcs24-maker/Forge-IQ/issues"
